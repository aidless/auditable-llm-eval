name: evolve-crossrepo

# Cross-repo self-evolution gate. This is the only job that can see BOTH repos:
# labels come from mcp-guard's tasks/cases.jsonl, so a confirmed miss can only
# be identified here. The gate reddens when a tool that mcp-guard labels poison
# fires no rule and is not declared in tasks/known_boundaries.json.
#
# Honest scope: mcp-guard is checked out at its default branch, so this job
# tracks that branch rather than a pinned SHA. If mcp-guard's main moves, the
# gate measures the moved tree -- which is the intent (continuous learning),
# but it also means a red here can come from a change in the other repo.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  cross-repo-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: aidless/mcp-guard
          path: mcp-guard

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"

      - run: python -m pip install --require-hashes -r requirements.build.lock

      - name: Self-evolution tests
        run: python -m pytest tests/test_agent_evolve.py -q

      - name: Cross-repo coverage gate
        run: |
          python -m agent_platform.evolve scan \
            --tools mcp-guard/tasks/cases.jsonl \
            --mcp-guard-repo mcp-guard \
            --out "$RUNNER_TEMP/evolve-report.json" \
            --fail-on-proposal

      # The usage gate must have teeth: a synthetic trace with an out-of-policy
      # call must make --fail-on-usage exit non-zero. Without this, a gate that
      # silently swallows the error would look identical to a passing one.
      - name: Usage gate has teeth (synthetic unauthorized call)
        run: |
          cat > "$RUNNER_TEMP/usage-trace.json" <<'JSON'
          {
            "tool_identity": {"n_tools": 1, "flagged": [],
              "tools": [{"name": "send_message", "digest": "x", "flagged": false, "rule_ids": []}]},
            "tool_usage": {"state": "unauthorized", "n_calls": 1,
              "tools_called": ["ghost_tool"], "unauthorized": ["ghost_tool"]},
            "tool_binding": {"state": "verified", "mismatches": []}
          }
          JSON
          if python -m agent_platform.evolve scan \
               --trace "$RUNNER_TEMP/usage-trace.json" \
               --out "$RUNNER_TEMP/usage-report.json" \
               --fail-on-usage; then
            echo "::error title=Usage gate has no teeth::--fail-on-usage exited 0 on an out-of-policy call"
            exit 1
          fi
          echo "usage gate correctly exited non-zero on an out-of-policy call"

      - name: Upload evolve report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: evolve-report
          path: ${{ runner.temp }}/evolve-report.json
          if-no-files-found: warn
