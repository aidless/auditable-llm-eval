name: mutation-control

# Proves the two gates in release.yml can actually redden the build.
#
# 1. `python scripts/validate_release.py` -- the four-check release assertion.
# 2. `python -m unittest discover -s tests -v` -- the 39 scorer tests, whose step
#    was `... || echo "skipping"` and therefore unconditionally green.
#
# A green baseline run cannot tell "gate passed" from "gate swallowed the error",
# because both are exit 0. Only a deliberately broken tree separates them, so
# this workflow asserts the negative for each gate.
#
# Stdlib only -- no pip install. This repo's eval pipeline is stdlib-only by
# design and the 3-OS matrix depends on that; a control job that installed
# anything would test a different environment than the one under audit.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  release-gates-have-teeth:
    name: release-gates-have-teeth
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      # Same env contract as release.yml: windows-latest defaults to cp1252 and
      # the scorer/verifier print CJK + box-drawing characters.
      PYTHONIOENCODING: utf-8
      # Belt and braces against stale bytecode. See the pycache note below.
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          check-latest: false

      # Stale-bytecode guard. unittest *imports* test modules, so a cached .pyc
      # written in the same second as an edited source file can be replayed
      # instead of the mutation, and the gate would go green for the wrong
      # reason. PYTHONDONTWRITEBYTECODE above stops new .pyc being written;
      # this purges any that a previous step or the checkout left behind.
      - name: Purge stale bytecode
        run: |
          set -euo pipefail
          find . -name '__pycache__' -type d -prune -print0 \
            | xargs -0 -r rm -rf
          find . -name '*.pyc' -delete
          echo "bytecode purged"

      - name: Assert pristine checkout
        run: |
          set -euo pipefail
          dirty="$(git status --porcelain)"
          if [ -n "$dirty" ]; then
            echo "::error title=Dirty checkout::mutation-control needs a pristine tree:"
            printf '%s\n' "$dirty"
            exit 1
          fi
          if [ -e tests/test_mutation_control_probe.py ]; then
            echo "::error title=Stale probe::leftover tests/test_mutation_control_probe.py"
            exit 1
          fi
          echo "tree is pristine"

      # ---------------------------------------------------------------- gate 1
      # validate_release.py runs the scorer and verifier as `python <script>`,
      # so those never consult __pycache__ -- but validate_release.py itself is
      # the entry point, and the checks it drives read the committed spec.
      - name: Gate 1 baseline (must pass, else stop)
        id: g1_base
        run: |
          set -euo pipefail
          set +e
          python scripts/validate_release.py 2>&1 | tee "$RUNNER_TEMP/g1_base.log"
          rc=${PIPESTATUS[0]}
          set -e
          echo "gate_exit=$rc" >> "$GITHUB_OUTPUT"
          if [ "$rc" -ne 0 ]; then
            echo "::error title=Baseline red::validate_release.py does not pass on a clean tree (exit $rc). Refusing to mutation-test a gate that is already failing."
            exit 1
          fi
          if ! grep -q '^OVERALL: PASS' "$RUNNER_TEMP/g1_base.log"; then
            echo "::error title=Ambiguous baseline::validate_release.py exited 0 without printing OVERALL: PASS"
            exit 1
          fi
          echo "baseline OK"

      # Mutation: a check type in the spec with no DISPATCH entry in the scorer.
      # This is the exact drift check 2 exists to catch, and it is surgical:
      # checks 1, 3 and 4 read other files and stay PASS, and the committed runs
      # under outputs/.../runs/*/ are read but never written.
      - name: Gate 1 -- inject spec drift
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import json

          p = Path("specs/scoring-rules.json")
          src = p.read_text(encoding="utf-8")
          anchor = '\n  ],\n  "global_detectors"'
          if src.count(anchor) != 1:
              raise SystemExit(f"anchor found {src.count(anchor)} times -- refusing to inject")
          inject = (
              ',\n    {\n      "type": "must_prove_determinism",\n'
              '      "soft": false,\n      "negation_aware": false,\n'
              '      "rationale": "mutation-control probe: spec check type with no DISPATCH entry."\n    }'
          )
          p.write_text(src.replace(anchor, inject + anchor), encoding="utf-8")
          doc = json.loads(p.read_text(encoding="utf-8"))
          if len(doc["checks"]) != 11:
              raise SystemExit("mutation did not land as expected")
          print("injected: must_prove_determinism")
          PY
          git diff --stat

      - name: Gate 1 -- mutation must return non-zero
        id: g1_mut
        run: |
          set -euo pipefail
          set +e
          python scripts/validate_release.py 2>&1 | tee "$RUNNER_TEMP/g1_mut.log"
          rc=${PIPESTATUS[0]}
          set -e
          echo "gate_exit=$rc" >> "$GITHUB_OUTPUT"
          if [ "$rc" -eq 0 ]; then
            echo "::error title=Gate has no teeth::validate_release.py exited 0 with a spec check type that has no scorer DISPATCH entry."
            exit 1
          fi
          if ! grep -q 'must_prove_determinism' "$RUNNER_TEMP/g1_mut.log"; then
            echo "::error title=Wrong failure::gate exited $rc without naming the injected check type -- it failed for an unrelated reason, so this run proves nothing."
            exit 1
          fi
          if ! grep -q '^OVERALL: FAIL' "$RUNNER_TEMP/g1_mut.log"; then
            echo "::error title=Wrong failure::expected OVERALL: FAIL, got something else"
            exit 1
          fi
          echo "gate 1 has teeth: exit=$rc, OVERALL: FAIL, drift named"

      - name: Gate 1 -- negative control (swallowing gate must be rejected)
        id: g1_neg
        run: |
          set -euo pipefail
          # The pre-fix shape of this step: any failure is swallowed.
          set +e
          python scripts/validate_release.py > "$RUNNER_TEMP/g1_neg.log" 2>&1 \
            || echo "skipping"
          swallow_rc=$?
          set -e
          echo "swallow_gate_exit=$swallow_rc" >> "$GITHUB_OUTPUT"
          echo "swallowing gate exit=$swallow_rc (expected 0 -- that is the bug)"
          if [ "$swallow_rc" -ne 0 ]; then
            echo "::error title=Negative control invalid::the swallowing gate exited $swallow_rc under mutation; expected 0"
            exit 1
          fi
          # Feed it to the same verdict rule the mutation step used. It must
          # come back "no teeth", or the assertion is vacuous.
          if grep -q 'must_prove_determinism' "$RUNNER_TEMP/g1_neg.log"; then
            echo "control verdict: NO TEETH (gate returned 0 under mutation) -- correctly rejected"
          else
            echo "::error title=Wrong failure::the swallowing gate exited 0 but never ran the check; this is not the historical bug"
            exit 1
          fi

      - name: Gate 1 -- restore
        if: always()
        run: |
          set -euo pipefail
          git checkout -- specs/scoring-rules.json
          dirty="$(git status --porcelain)"
          if [ -n "$dirty" ]; then
            echo "::error title=Restore failed::dirty tree after restoring the spec:"
            printf '%s\n' "$dirty"
            exit 1
          fi
          echo "spec restored"

      # ---------------------------------------------------------------- gate 2
      - name: Gate 2 baseline (must pass, else stop)
        id: g2_base
        run: |
          set -euo pipefail
          set +e
          python -m unittest discover -s tests -v 2>&1 | tee "$RUNNER_TEMP/g2_base.log"
          rc=${PIPESTATUS[0]}
          set -e
          echo "gate_exit=$rc" >> "$GITHUB_OUTPUT"
          if [ "$rc" -ne 0 ]; then
            echo "::error title=Baseline red::the 39 scorer tests do not pass on a clean tree (exit $rc). Refusing to mutation-test a gate that is already failing."
            exit 1
          fi
          if ! grep -q '^OK' "$RUNNER_TEMP/g2_base.log"; then
            echo "::error title=Ambiguous baseline::unittest exited 0 without printing OK"
            exit 1
          fi
          echo "baseline OK"

      - name: Gate 2 -- inject failing test
        run: |
          set -euo pipefail
          cat > tests/test_mutation_control_probe.py <<'PROBE'
          import unittest


          class TestMutationControlProbe(unittest.TestCase):
              def test_mutation_control_probe_must_fail(self):
                  self.assertEqual(
                      "mutation-control-introduced-failure",
                      "the-unmutated-value",
                  )
          PROBE
          git status --porcelain | tee "$RUNNER_TEMP/g2_mutated.txt"
          if ! grep -q '^?? tests/test_mutation_control_probe\.py$' "$RUNNER_TEMP/g2_mutated.txt"; then
            echo "::error title=Mutation not visible::probe file absent from git status"
            exit 1
          fi

      - name: Gate 2 -- mutation must return non-zero
        id: g2_mut
        run: |
          set -euo pipefail
          set +e
          python -m unittest discover -s tests -v 2>&1 | tee "$RUNNER_TEMP/g2_mut.log"
          rc=${PIPESTATUS[0]}
          set -e
          echo "gate_exit=$rc" >> "$GITHUB_OUTPUT"
          if [ "$rc" -eq 0 ]; then
            echo "::error title=Gate has no teeth::unittest discover exited 0 with a failing test in tests/."
            exit 1
          fi
          if ! grep -q '^FAILED' "$RUNNER_TEMP/g2_mut.log"; then
            echo "::error title=Wrong failure::unittest exited $rc without printing FAILED"
            exit 1
          fi
          if ! grep -q 'test_mutation_control_probe_must_fail' "$RUNNER_TEMP/g2_mut.log"; then
            echo "::error title=Wrong failure::the failure did not come from the injected test"
            exit 1
          fi
          echo "gate 2 has teeth: exit=$rc, FAILED, injected test named"

      - name: Gate 2 -- negative control (swallowing gate must be rejected)
        id: g2_neg
        run: |
          set -euo pipefail
          # The pre-fix shape of this step: the guard swallows any failure.
          set +e
          if python -c "import os, sys; sys.exit(0 if os.path.isdir('tests') else 1)"; then
            python -m unittest discover -s tests -v > "$RUNNER_TEMP/g2_neg.log" 2>&1 \
              || echo "skipping"
          else
            echo "::notice title=No tests::tests/ does not exist in this commit"
          fi
          swallow_rc=$?
          set -e
          echo "swallow_gate_exit=$swallow_rc" >> "$GITHUB_OUTPUT"
          echo "swallowing gate exit=$swallow_rc (expected 0 -- that is the bug)"
          if [ "$swallow_rc" -ne 0 ]; then
            echo "::error title=Negative control invalid::the swallowing gate exited $swallow_rc under mutation; expected 0"
            exit 1
          fi
          if ! grep -q 'test_mutation_control_probe_must_fail' "$RUNNER_TEMP/g2_neg.log"; then
            echo "::error title=Wrong failure::the swallowing gate exited 0 without ever running the injected test"
            exit 1
          fi
          echo "control verdict: NO TEETH (gate returned 0 under mutation) -- correctly rejected"

      - name: Gate 2 -- restore and verify clean
        if: always()
        run: |
          set -euo pipefail
          rm -f tests/test_mutation_control_probe.py
          find . -name '__pycache__' -type d -prune -print0 \
            | xargs -0 -r rm -rf
          find . -name '*.pyc' -delete
          dirty="$(git status --porcelain)"
          if [ -n "$dirty" ]; then
            echo "::error title=Restore failed::dirty tree after removing the probe:"
            printf '%s\n' "$dirty"
            exit 1
          fi
          echo "tree restored and clean"

      - name: Summary
        if: always()
        run: |
          set -euo pipefail
          {
            echo "gate | baseline | mutation | negative-control"
            echo "validate_release.py | ${{ steps.g1_base.outputs.gate_exit }} | ${{ steps.g1_mut.outputs.gate_exit }} | swallow=${{ steps.g1_neg.outputs.swallow_gate_exit }}"
            echo "unittest discover  | ${{ steps.g2_base.outputs.gate_exit }} | ${{ steps.g2_mut.outputs.gate_exit }} | swallow=${{ steps.g2_neg.outputs.swallow_gate_exit }}"
          } | tee -a "$GITHUB_STEP_SUMMARY"